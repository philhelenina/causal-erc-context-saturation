name: senticcrystal
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch>=2.1
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - seaborn>=0.12
  - tqdm>=4.65
  - statsmodels>=0.14
  - nltk>=3.8
  - pyyaml>=6.0
  - pip
  - pip:
      - sentence-transformers>=2.2.2
      - transformers>=4.30.0
      - optuna>=3.0.0
      # Optional legacy Bayesian modules:
      # - pyro-ppl>=1.8.0
